# Development overrides. Automatically merged by `docker compose up`.
services:
  db:
    ports:
      - "5432:5432"

  api:
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
