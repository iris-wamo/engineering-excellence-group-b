name: Release deploy

# One deploy, called by release.yml for staging and then production. Runs an already-pushed
# image (by digest) with the same scripts/release.sh used locally, then smoke tests it.
#
# Configuration comes from the GitHub environment named in `environment`:
#   secrets   POSTGRES_PASSWORD, JWT_SECRET_KEY, SMOKE_PASSWORD
# "production" has a required reviewer, so this job waits for approval before it starts.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image:
        description: Image to deploy, pinned by digest (repo@sha256:...)
        type: string
        required: true
      sha:
        description: Commit the image was built from (for checkout of the deploy scripts)
        type: string
        required: true

permissions: {}

env:
  CURRENT_SESSION: session-06-websockets-cicd-observability

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    # One deploy per environment at a time. A newer run waiting here replaces an older waiting
    # one, so an approver always promotes the latest green build.
    concurrency:
      group: release-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ env.CURRENT_SESSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same keys as .env.<env>.example; the values only exist in the environment's secrets
      # and in this runner's (git-ignored) file, never in the image.
      - name: Write .env.${{ inputs.environment }} from the environment's secrets
        env:
          ENV_NAME: ${{ inputs.environment }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          for name in POSTGRES_PASSWORD JWT_SECRET_KEY SMOKE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::Set $name in the '$ENV_NAME' environment's secrets."
              exit 1
            fi
          done
          grep -vE '^(POSTGRES_PASSWORD|JWT_SECRET_KEY|SMOKE_PASSWORD)=' ".env.$ENV_NAME.example" > ".env.$ENV_NAME"
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET_KEY=$JWT_SECRET_KEY"
            echo "SMOKE_PASSWORD=$SMOKE_PASSWORD"
          } >> ".env.$ENV_NAME"

      - name: Deploy and smoke test
        env:
          ENV_NAME: ${{ inputs.environment }}
          IMAGE_REF: ${{ inputs.image }}
        run: scripts/release.sh deploy "$ENV_NAME" "$IMAGE_REF"

      - name: Record the release
        env:
          ENV_NAME: ${{ inputs.environment }}
          IMAGE_REF: ${{ inputs.image }}
        run: |
          {
            echo "### $ENV_NAME"
            echo "Smoke test passed on \`$IMAGE_REF\`"
            echo '```'
            scripts/release.sh status "$ENV_NAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show logs on failure
        if: failure()
        env:
          ENV_NAME: ${{ inputs.environment }}
        run: |
          IMAGE=unused docker compose -p "taskflow-$ENV_NAME" -f compose.release.yaml \
            --env-file ".env.$ENV_NAME" logs --no-color --tail 200 api migrate
