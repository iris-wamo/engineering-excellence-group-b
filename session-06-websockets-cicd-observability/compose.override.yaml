# Development overrides. Automatically merged by `docker compose up`.
services:
  db:
    ports:
      - "5433:5432"

    volumes:
      # Creates <POSTGRES_DB>_test for the test suite. The image runs it only when pgdata is
      # empty; for an existing volume run `make docker-test-db` (safe to repeat).
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-create-test-db.sh:ro

  api:
    volumes:
      - ./app:/app/app
      - ./packages:/app/packages
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload

  celery-worker:
    volumes:
      - ./app:/app/app
      - ./packages:/app/packages
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  celery-beat:
    volumes:
      - ./app:/app/app
      - ./packages:/app/packages
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  flower:
    volumes:
      - ./app:/app/app
      - ./packages:/app/packages
