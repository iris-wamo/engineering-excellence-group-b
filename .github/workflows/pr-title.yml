name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      # Squash merge turns the PR title into the commit message, so linting
      # the title is what keeps the history in `type(scope): description` form.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            perf
            build
          # Scope is optional, e.g. `feat(session-04): ...` or `docs: ...`.
          requireScope: false
          # Description must not start with an uppercase letter.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The description "{subject}" must start with a lowercase letter,
            e.g. "feat(session-04): add shared package skeleton".
