[project]
name = "taskflow_shared"
version = "0.1.0"
description = "TaskFlow shared backend package (config, errors, pagination, logging, contracts, enums)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110.0",
    "starlette>=0.36.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["taskflow_shared*"]

[tool.setuptools.package-data]
taskflow_shared = ["py.typed"]
