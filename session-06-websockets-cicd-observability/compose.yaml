name: taskflow
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7.0
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-taskflow}

    volumes:
      - mongodata:/data/db

    ports:
      - "27017:27017"

    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

    # Append-only file so stream entries and consumer group state survive a restart.
    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redisdata:/data

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Inside the Compose network the app reaches Postgres, Mongo, and Redis by the
    # service names "db", "mongo", and "redis", not localhost.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-taskflow}
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Skip the image entrypoint's `alembic upgrade head`: only the api service migrates,
    # so containers starting together never race on the same migration.
    entrypoint: []
    command: ["celery", "-A", "app.core.celery_app", "worker", "-l", "info"]

    # Worker metrics (Prometheus text format). Bound to localhost; Prometheus in the same
    # Compose network scrapes celery-worker:9808 directly.
    ports:
      - "127.0.0.1:9808:9808"

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-taskflow}
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # Pool processes write their metrics here and the main process serves the sum
      # (see app/observability/celery.py). One directory per worker; never share it.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-worker
      WORKER_METRICS_ADDR: 0.0.0.0

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      disable: true

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Only the api service migrates (see celery-worker).
    entrypoint: []
    # The schedule file is container-local and not persisted. Both entries are fixed
    # intervals, so after a restart Beat simply runs them on its first tick.
    command: ["celery", "-A", "app.core.celery_app", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-taskflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      disable: true

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Only the api service migrates (see celery-worker).
    entrypoint: []
    command: ["celery", "-A", "app.core.celery_app", "flower", "--port=${FLOWER_PORT:-5555}"]

    # Flower can revoke tasks and shows task arguments: publish it on the host loopback
    # only, behind basic auth. There is no default login: Compose refuses to start
    # until FLOWER_BASIC_AUTH is set (see .env.example).
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:${FLOWER_PORT:-5555}"

    # `-A app.core.celery_app` loads app Settings, which require the database and Mongo
    # settings even though Flower only talks to Redis.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-taskflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?Set FLOWER_BASIC_AUTH=user:password in .env (see .env.example)}

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      disable: true

  # Traces: spans from the api and worker over OTLP (published on localhost too, for `make run`).
  # Viewed in Grafana (Explore > Tempo); there is no separate tracing UI.
  tempo:
    image: grafana/tempo:2.9.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"

  # Metrics: scrapes api:8000/metrics and celery-worker:9808 (docker/prometheus/prometheus.yml)
  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  # Dashboards and traces. The data sources and the TaskFlow dashboard are provisioned from
  # docker/grafana, so nothing needs setting up by hand. Anonymous viewers are allowed
  # (localhost only) and may use Explore, which is where traces are searched.
  grafana:
    image: grafana/grafana:12.2.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/taskflow.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  pgdata:
  mongodata:
  redisdata:
