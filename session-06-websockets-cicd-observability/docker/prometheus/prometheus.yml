# Scrapes the API and the Celery worker (see docs/session-06/observability.md).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # The worker's main process serves the summed metrics of its pool processes
  - job_name: celery-worker
    static_configs:
      - targets: ["celery-worker:9808"]
