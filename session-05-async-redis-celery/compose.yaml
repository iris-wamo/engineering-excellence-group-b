name: taskflow
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7.0
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-taskflow}

    volumes:
      - mongodata:/data/db

    ports:
      - "27017:27017"

    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redisdata:/data

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Inside the Compose network the app reaches Postgres, Mongo, and Redis by the
    # service names "db", "mongo", and "redis", not localhost.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-taskflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Skip the image entrypoint's `alembic upgrade head`: only the api service migrates,
    # so containers starting together never race on the same migration.
    entrypoint: []
    command: ["celery", "-A", "app.core.celery_app", "worker", "-l", "info"]

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-taskflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      disable: true

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Only the api service migrates (see celery-worker).
    entrypoint: []
    # The schedule file is container-local and not persisted. Both entries are fixed
    # intervals, so after a restart Beat simply runs them on its first tick.
    command: ["celery", "-A", "app.core.celery_app", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-taskflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      disable: true

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Only the api service migrates (see celery-worker).
    entrypoint: []
    command: ["celery", "-A", "app.core.celery_app", "flower", "--port=5555"]

    # Flower can revoke tasks and shows task arguments: publish it on the host loopback
    # only, behind basic auth.
    ports:
      - "127.0.0.1:5555:5555"

    # `-A app.core.celery_app` loads app Settings, which require the database and Mongo
    # settings even though Flower only talks to Redis.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-taskflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-taskflow:taskflow}

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      disable: true

volumes:
  pgdata:
  mongodata:
  redisdata:


